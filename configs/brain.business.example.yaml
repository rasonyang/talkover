# Standalone config for the business Brain provider; the brain section of the serve config can reference or override it.
brain:
  provider: business
  llm:
    kind: anthropic
    base_url: https://api.deepseek.com/anthropic
    api_key: ${DEEPSEEK_API_KEY}
    model: deepseek-flash
  business_api:
    # `uv run talkover mock-api` serves this address with the fixture dataset.
    base_url: http://127.0.0.1:9100
    timeout_sec: 3
  # Chinese phrases that trigger transfer_to_human
  transfer_keywords: ["转人工", "人工客服", "找个人"]
  spoken_numbers: false      # rewrite digits into segmented spoken form before speaking
  max_rounds: 6              # LLM rounds per Brain invocation
  # Spoken to the customer when the loop cannot answer; null uses the built-in English text
  fallback_texts:
    round_cap: "抱歉，这个问题我这边暂时查不到，帮您转接人工客服。"
    failure: "抱歉，系统暂时没有响应，帮您转接人工客服。"
    no_answer: "抱歉，我没有听清，您可以再说一遍吗？"

